<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Checker</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #c67a7a;
        }

        .container {
            background: rgb(239, 235, 235);
            padding: 30px;
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            width: 350px;
        }

        input {
            width: 90%;
            padding: 10px;
            font-size: 16px;
            margin-top: 10px;
        }

        #result {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }

        .weak {
            color: red;
        }

        .medium {
            color: orange;
        }

        .strong {
            color: blue;
        }

        .very-strong {
            color: green;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Password Checker</h2>

        <input type="password" id="password" placeholder="Enter password">

        <p id="result"></p>
    </div>

    <script>
        const passwordInput = document.getElementById("password");
        const result = document.getElementById("result");

        passwordInput.addEventListener("input", function () {
            const password = passwordInput.value;
            const length = password.length;
            const hasNumber = /\d/.test(password);

            result.className = "";

            if (length === 0) {
                result.textContent = "Enter a password";
            }
            else if (length <= 4) {
                result.textContent = "Weak Password";
                result.classList.add("weak");
            }
            else if (length > 4 && length < 8) {
                result.textContent = "Medium Password";
                result.classList.add("medium");
            }
            else if (length >= 8 && hasNumber) {
                result.textContent = "Very Strong Password";
                result.classList.add("very-strong");
            }
            else if (length >= 8) {
                result.textContent = "Strong Password";
                result.classList.add("strong");
            }
        });
    </script> 

</body>
</html>
